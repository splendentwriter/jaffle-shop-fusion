name: Build dev and promote to main

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  id-token: write # required to request the OIDC JWT for Workload Identity Federation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/747321349045/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "jaffle-sa@jaffle-shop-505616.iam.gserviceaccount.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt Fusion
        run: python3 -m pip install --pre dbt

      - name: Write dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          jaffle_shop:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: jaffle-shop-505616
                dataset: jaffle_shop
                threads: 4
                timeout_seconds: 300
                location: US
          EOF

      - name: Install package dependencies
        run: dbt deps

      - name: Build
        run: dbt build

      - name: Push dev to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:main
