config-version: 2

name: "jaffle_shop"
version: "3.0.0"
require-dbt-version: ">=1.12.0"

dbt-cloud:
  project-id: jaffle-shop-505616 # Put your project id here

profile: jaffle_shop # Put your profile here

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  jaffle_shop:
    +schema: raw
    jaffle-data:
      +enabled: "{{ var('load_source_data', false) }}"
      raw_customer_addresses:
        # postal codes are all-numeric in the sample data, which makes agate's
        # type inference guess INT64 and silently truncate leading zeros
        +column_types:
          postal_code: string
      raw_loyalty_transactions:
        # reward_id is empty for every row in this generated sample (thin
        # overlap between loyalty-enrolled customers and completed
        # checkouts meant no account crossed the redemption threshold), so
        # agate has no non-blank value to infer a type from and defaults to
        # INT64 instead of STRING
        +column_types:
          reward_id: string

snapshots:
  jaffle_shop:
    +schema: analytics

models:
  jaffle_shop:
    staging:
      +materialized: view
      +schema: ingestion
    intermediate:
      +materialized: view
      +schema: analytics
    core:
      +materialized: table
      +schema: analytics
    marts:
      +materialized: table
      +schema: analytics

  elementary:
    +schema: elementary

data_tests:
  jaffle_shop:
    # Project default: a failing test should surface on the Data Platform ->
    # Data Quality page, not fail the pipeline run. Tests that need to keep
    # blocking (e.g. macros/relationships.sql's error-in-prod severity) set
    # config(severity=...) directly in their own definition, which takes
    # precedence over this project-level default.
    +severity: warn

vars:
  disable_dbt_artifacts_autoupload: true

flags:
  require_generic_test_arguments_property: true