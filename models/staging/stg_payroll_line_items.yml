models:
  - name: stg_payroll_line_items
    description: One row per (payroll_run, employee) paycheck.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "net_pay_cents = gross_pay_cents - federal_tax_cents - state_tax_cents - other_deductions_cents"
    columns:
      - name: payroll_line_item_id
        data_tests:
          - not_null
          - unique
      - name: payroll_run_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payroll_runs')
                field: payroll_run_id
      - name: employee_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_id
