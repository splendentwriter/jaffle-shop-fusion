models:
  - name: stg_checkout_events
    description: >
      Append-only checkout funnel event log. One row per event. A known
      handful of rows reference a checkout_id that never landed — same
      orphaned streaming-insert incident as stg_payment_attempts and
      stg_checkout_items, pending cleanup once it ages out of BigQuery's
      streaming buffer.
    columns:
      - name: checkout_event_id
        data_tests:
          - not_null
          - unique
      - name: checkout_id
        data_tests:
          - not_null
          - relationships:
              config:
                severity: warn
              arguments:
                to: ref('stg_checkouts')
                field: checkout_id
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['started', 'address_entered', 'shipping_selected', 'completed', 'abandoned', 'payment_failed']
