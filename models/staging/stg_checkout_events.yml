models:
  - name: stg_checkout_events
    description: Append-only checkout funnel event log. One row per event.
    data_tests:
      - elementary.schema_changes
    columns:
      - name: checkout_event_id
        data_tests:
          - not_null
          - unique
      - name: checkout_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_checkouts')
                field: checkout_id
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['started', 'address_entered', 'shipping_selected', 'completed', 'abandoned', 'payment_failed']
