models:
  - name: stg_shipments
    description: One row per shipment.
    data_tests:
      - elementary.schema_changes
    columns:
      - name: shipment_id
        data_tests:
          - not_null
          - unique
      - name: fulfillment_order_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_fulfillment_orders')
                field: fulfillment_order_id
      - name: carrier_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_carriers')
                field: carrier_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'delayed', 'lost', 'in_transit']
