models:
  - name: stg_supplier_products
    description: One row per (supplier, product) they can supply. A product can have more than one supplier.
    data_tests:
      - elementary.schema_changes
    columns:
      - name: supplier_product_id
        data_tests:
          - not_null
          - unique
      - name: supplier_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_suppliers')
                field: supplier_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
