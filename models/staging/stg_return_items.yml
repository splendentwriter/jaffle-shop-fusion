models:
  - name: stg_return_items
    description: One row per line item on a return.
    data_tests:
      - elementary.schema_changes
    columns:
      - name: return_item_id
        data_tests:
          - not_null
          - unique
      - name: return_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_returns')
                field: return_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              config:
                severity: warn
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: condition_reported
        data_tests:
          - accepted_values:
              arguments:
                values: ['opened', 'unopened', 'damaged']
