models:
  - name: stg_payouts
    description: One row per weekly merchant payout batch, net of processing fees.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "period_end > period_start"
    columns:
      - name: payout_id
        data_tests:
          - not_null
          - unique
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending']
