models:
  - name: stg_gift_card_transactions
    description: >
      Unified gift card ledger. amount is positive for issue/refund_credit,
      negative for redeem/expire. related_checkout_id is only set for
      redeem transactions tied to a purchase.
    data_tests:
      - elementary.schema_changes
    columns:
      - name: gift_card_transaction_id
        data_tests:
          - not_null
          - unique
      - name: gift_card_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_gift_cards')
                field: gift_card_id
      - name: related_checkout_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_checkouts')
                field: checkout_id
      - name: transaction_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['issue', 'redeem', 'refund_credit', 'expire']
