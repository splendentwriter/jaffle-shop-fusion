models:
  - name: stg_reviews
    description: One row per product review. status is pending/published/rejected.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "rating between 1 and 5"
    columns:
      - name: review_id
        data_tests:
          - not_null
          - unique
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['published', 'rejected', 'pending']
