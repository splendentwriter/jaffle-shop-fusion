models:
  - name: stg_delivery_attempts
    description: One row per delivery attempt against a shipment.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - shipment_id
              - attempt_number
    columns:
      - name: delivery_attempt_id
        data_tests:
          - not_null
          - unique
      - name: shipment_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shipments')
                field: shipment_id
      - name: outcome
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'no_access', 'refused']
