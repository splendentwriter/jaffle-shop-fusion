models:
  - name: stg_customer_preferences
    description: >
      One row per customer who has set communication preferences. Not every
      customer has a row here — absence means preferences were never
      captured, not that they were declined.
    data_tests:
      - elementary.schema_changes
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: preferred_channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['email', 'sms', 'push', 'none']
