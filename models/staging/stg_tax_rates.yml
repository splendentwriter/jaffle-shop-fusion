models:
  - name: stg_tax_rates
    description: One row per shipping region's tax rate.
    data_tests:
      - elementary.schema_changes
    columns:
      - name: tax_rate_id
        data_tests:
          - not_null
          - unique
      - name: region
        data_tests:
          - not_null
          - unique
      - name: tax_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.15
                inclusive: true
