models:
  - name: stg_product_images
    description: One row per product image.
    columns:
      - name: image_id
        data_tests:
          - not_null
          - unique
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
