models:
  - name: stg_returns
    description: >
      One row per return request against a delivered shipment. Carries its
      own refund outcome rather than linking to stg_refunds (Phase 8) —
      see raw_returns' source description for why.
    data_tests:
      - elementary.schema_changes
      - dbt_utils.expression_is_true:
          arguments:
            expression: "refund_status != 'completed' or refunded_at is not null"
    columns:
      - name: return_id
        data_tests:
          - not_null
          - unique
      - name: shipment_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shipments')
                field: shipment_id
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: reason
        data_tests:
          - accepted_values:
              arguments:
                values: ['defective', 'wrong_item', 'no_longer_needed', 'damaged_in_transit', 'not_as_described']
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['closed', 'inspected', 'rejected']
