version: 2

sources:
  - name: ecom
    schema: jaffle_shop_raw
    description: E-commerce data for the Jaffle Shop
    tables:
      - name: raw_customers
        description: One record per person who has purchased one or more items
      - name: raw_customer_accounts
        description: One record per customer account (login/email/status). A customer may have zero, one, or (due to duplicate signups) more than one account.
        config:
          loaded_at_field: updated_at
      - name: raw_customer_addresses
        description: One record per address a customer has on file. A customer may have zero or many; rows are not guaranteed unique.
      - name: raw_customer_preferences
        description: One record per customer's communication preferences. Not every customer has filled these in.
      - name: raw_customer_consent
        description: Append-only log of consent grants/revocations per customer and consent type.
      - name: raw_customer_devices
        description: One record per device seen for a customer.
      - name: raw_orders
        description: One record per order (consisting of one or more order items)
        config:
          loaded_at_field: ordered_at
      - name: raw_items
        description: Items included in an order
      - name: raw_stores
        config:
          loaded_at_field: opened_at
      - name: raw_products
        description: One record per SKU for items sold in stores
      - name: raw_supplies
        description: One record per supply per SKU of items sold in stores
      - name: raw_brands
        description: One record per brand/supplier.
      - name: raw_product_categories
        description: Product category hierarchy. Self-referencing via parent_category_id; top-level categories have no parent.
      - name: raw_product_category_map
        description: Many-to-many mapping of product SKU to category. A SKU can belong to more than one category.
      - name: raw_product_brands
        description: One record per SKU's brand assignment. Not every SKU has a brand assigned yet.
      - name: raw_product_attributes
        description: EAV-style product attributes (spice level, calories, allergens, etc). A SKU may have more than one row for the same attribute_name if it was re-entered upstream.
      - name: raw_product_images
        description: One record per product image.
      - name: raw_product_tags
        description: One record per (sku, tag) pairing. A SKU may have zero or many tags.
      - name: raw_sessions
        description: One record per browsing session. customer_id/device_id are null for anonymous (unauthenticated) sessions.
        config:
          loaded_at_field: started_at
      - name: raw_web_events
        description: >
          Unified clickstream event stream (page_view, product_view, search, add_to_cart), one row per
          event. A small number of events reference a session_id that no longer resolves to a session
          record.
        config:
          loaded_at_field: occurred_at
      - name: raw_carts
        description: One record per cart. status captures the lifecycle (active/abandoned/converted/merged).
        config:
          loaded_at_field: updated_at
      - name: raw_cart_items
        description: >
          One record per line item added to a cart. is_saved_for_later marks items moved to a
          save-for-later state; removed_at marks items removed outright. A small number of rows have a
          non-positive quantity (upstream data-entry bug) or reference a delisted sku.
      - name: raw_cart_events
        description: Append-only cart lifecycle event log (created, item_added, item_removed, abandoned, converted).
      - name: raw_checkouts
        description: >
          One record per checkout attempt. Shipping address is captured as a snapshot on the row
          (not a live link to the customer's address book) since a checkout address shouldn't change
          retroactively if the customer edits their saved addresses later.
        config:
          loaded_at_field: started_at
      - name: raw_checkout_items
        description: Snapshot of a checkout's line items at the moment checkout started, independent of later cart edits.
      - name: raw_checkout_events
        description: Append-only checkout funnel event log (started, address_entered, shipping_selected, completed, abandoned, payment_failed).
      - name: raw_checkout_failures
        description: One record per failed payment attempt during checkout, with a failure reason.
      - name: raw_order_addresses
        description: >
          Shipping/billing address snapshot for a sample of existing orders. Not every order has a row —
          see CONVENTIONS.md / scripts/generate_order_domain_seeds.py for why full coverage wasn't attempted.
      - name: raw_order_status_history
        description: >
          Append-only order status log (placed, processing, fulfilled, delivered, cancelled) for a
          sample of existing orders. A small number of rows reference an order_id that no longer exists.
      - name: raw_order_adjustments
        description: One record per post-order adjustment (discount, goodwill credit, price/tax correction) applied to an order.
      - name: raw_payment_methods
        description: One record per payment method saved to a customer's wallet.
      - name: raw_payment_attempts
        description: >
          One record per payment attempt against a checkout. status is captured/declined/error.
          decline_reason is only populated for non-captured attempts.
      - name: raw_authorizations
        description: One record per payment authorization.
      - name: raw_captures
        description: One record per capture against an authorization. amount_cents can be less than the authorization for a partial capture.
      - name: raw_refunds
        description: One record per refund request against a capture. Not all refunds have completed (see status).
      - name: raw_disputes
        description: >
          One record per payment dispute. status covers the full outcome range including chargeback -
          a chargeback is modeled as a dispute outcome, not a separate entity.
      - name: raw_promotions
        description: One record per promotion. Discount rule fields (discount_value, min/max) live on the promotion itself.
      - name: raw_coupons
        description: One record per redeemable coupon code. A promotion can have more than one code.
      - name: raw_coupon_redemptions
        description: >
          One record per coupon redemption against a checkout. A small number of rows are duplicate
          redemptions of the same coupon on the same checkout (a known upstream retry-button bug).
      - name: raw_warehouses
        description: One record per distribution warehouse. Distinct from the retail stores in raw_stores.
      - name: raw_inventory_levels
        description: Current-state snapshot of on-hand quantity, one record per (warehouse, sku).
        config:
          loaded_at_field: updated_at
      - name: raw_inventory_transactions
        description: >
          Append-only inventory ledger (receipt, sale, transfer_in, transfer_out, adjustment). A small
          number of rows reference a delisted sku.
      - name: raw_stock_reservations
        description: One record per stock hold placed against a checkout. status covers held/committed/released/expired.
      - name: raw_suppliers
        description: One record per supplier/vendor of finished products.
      - name: raw_supplier_products
        description: One record per (supplier, sku) they can supply, with the supplier's own cost and lead time.
      - name: raw_purchase_orders
        description: One record per purchase order placed with a supplier to replenish a warehouse.
      - name: raw_purchase_order_items
        description: One record per line item on a purchase order.
      - name: raw_goods_receipts
        description: >
          One record per goods-receipt event against a purchase order item. quantity_received can be
          less than quantity_ordered for a partial or short-shipped receipt.
      - name: raw_fulfillment_orders
        description: One record per fulfillment order raised against a completed checkout.
        config:
          loaded_at_field: created_at
      - name: raw_fulfillment_items
        description: One record per line item on a fulfillment order.
      - name: raw_fulfillment_events
        description: >
          Append-only fulfillment lifecycle event log. "Picking" and "packing" from the build-out plan
          are event_type values here (picking_started/picking_completed/packing_started/packing_completed),
          not separate tables.
      - name: raw_carriers
        description: One record per shipping carrier.
      - name: raw_shipments
        description: >
          One record per shipment. Only created for shipped fulfillment orders whose checkout picked an
          actual shipping method — pickup orders never get a shipment.
      - name: raw_shipment_items
        description: One record per line item on a shipment.
      - name: raw_tracking_events
        description: Append-only carrier tracking event log (label_created, picked_up, in_transit, out_for_delivery, delivered, exception).
      - name: raw_delivery_attempts
        description: One record per delivery attempt against a shipment. A shipment can have more than one attempt.
      - name: raw_returns
        description: >
          One record per return request against a delivered shipment. Carries its own refund outcome
          (refund_status/refund_amount_cents/refunded_at) rather than linking to Phase 8's raw_refunds -
          see scripts/generate_returns_domain_seeds.py for why.
      - name: raw_return_items
        description: One record per line item on a return.
      - name: raw_return_events
        description: Append-only return lifecycle event log (requested, approved, rejected, item_received, inspection_completed, refund_issued).
      - name: raw_return_inspections
        description: One record per inspection performed on a returned line item.
      - name: raw_reviews
        description: One record per product review.
      - name: raw_review_votes
        description: >
          One record per customer's helpful/not_helpful vote on a review. A small number of rows are
          duplicate votes from the same customer on the same review (a known client-side double-submit bug).
      - name: raw_review_moderation_actions
        description: One record per moderation decision made on a review. Only present for reviews that were actually moderated (not pending).
      - name: raw_review_responses
        description: One record per merchant/support response to a review.
      - name: raw_campaigns
        description: One record per marketing campaign.
      - name: raw_campaign_channels
        description: Bridge of campaign to channel. A campaign can run on more than one channel.
      - name: raw_marketing_events
        description: >
          Unified marketing event stream (email/sms/push/social/search/display), one row per event.
          Consolidates the plan's campaign/email/SMS/push events into one typed stream, same pattern as
          raw_web_events.
      - name: raw_customer_acquisition
        description: One record per customer's first-touch acquisition channel. campaign_id is set only for paid/campaign-driven acquisition.