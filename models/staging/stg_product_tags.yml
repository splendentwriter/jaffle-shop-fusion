models:
  - name: stg_product_tags
    description: One row per (product, tag) pairing.
    data_tests:
      - elementary.schema_changes
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_id
              - tag
    columns:
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
