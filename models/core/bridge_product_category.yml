models:
  - name: bridge_product_category
    description: >
      Many-to-many bridge between product and category. One row per
      (product_id, category_id); a product can belong to more than one
      category (e.g. also tagged into a seasonal category).
    data_tests:
      - elementary.schema_changes
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_id
              - category_id
    columns:
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_category')
                field: category_id
