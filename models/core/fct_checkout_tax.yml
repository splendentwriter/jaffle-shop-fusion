models:
  - name: fct_checkout_tax
    description: >
      One row per checkout, with sales tax computed from
      stg_tax_rates (matched on shipping_region) against the checkout's
      item subtotal. This is the plan's "taxes" deliverable — computed
      here rather than stored as raw data, since checkouts never carried a
      tax field.
    columns:
      - name: checkout_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_checkouts')
                field: checkout_id
