models:
  - name: fct_purchase_order_item
    description: >
      One row per purchase order line item, with received quantity and
      fill_rate (received / ordered) rolled up from goods receipts.
      quantity_received is 0 for items whose order hasn't been received yet
      (confirmed/cancelled status purchase orders).
    data_tests:
      - elementary.schema_changes
    columns:
      - name: purchase_order_item_id
        data_tests:
          - not_null
          - unique
      - name: purchase_order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_purchase_orders')
                field: purchase_order_id
      - name: fill_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
