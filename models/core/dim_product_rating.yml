models:
  - name: dim_product_rating
    description: >
      One row per product with at least one published review, with rating
      distribution rolled up. Products with zero published reviews have no
      row here — not a zero/null rating.
    data_tests:
      - elementary.schema_changes
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: average_rating
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
