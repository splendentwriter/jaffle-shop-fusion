models:
  - name: dim_category
    description: >
      One row per product category, with the parent category resolved by a
      self-join. has_orphaned_parent flags rows whose parent_category_id
      doesn't resolve to a real category, so they aren't silently
      indistinguishable from genuine top-level categories once
      parent_category_name is null.
    data_tests:
      - elementary.schema_changes
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (is_top_level and has_orphaned_parent)"
    columns:
      - name: category_id
        data_tests:
          - not_null
          - unique
