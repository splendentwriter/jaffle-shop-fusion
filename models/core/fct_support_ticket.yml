models:
  - name: fct_support_ticket
    description: >
      One row per support ticket, with message counts and reopen count
      rolled up. hours_to_resolve and resolved_at are null for
      still-open tickets.
    columns:
      - name: ticket_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: ['billing', 'shipping', 'product_question', 'return_refund', 'technical', 'other']
