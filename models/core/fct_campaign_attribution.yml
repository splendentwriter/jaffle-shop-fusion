models:
  - name: fct_campaign_attribution
    description: >
      Last-touch marketing attribution: one row per completed checkout that
      had a marketing click from the same customer within 7 days before
      checkout started. Not every completed checkout has a row — only ones
      with a qualifying touch are attributed. This is the plan's
      "attribution" deliverable, built as a derived model rather than raw
      data since attribution is a computed judgment call (lookback window,
      last-touch vs. other models), not a fact a source system emits.
    data_tests:
      - elementary.schema_changes
    columns:
      - name: checkout_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_checkouts')
                field: checkout_id
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id
      - name: hours_between_touch_and_checkout
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
