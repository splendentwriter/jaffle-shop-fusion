models:
  - name: mart_reconciliation
    description: >
      One row per payout with amounts in dollars and the is_reconciled flag
      from fct_payout_reconciliation (payout batch total vs. recomputed net
      of per-capture fees, 1-cent tolerance).
    columns:
      - name: payout_id
        data_tests:
          - not_null
          - unique
