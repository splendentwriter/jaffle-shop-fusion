models:
  - name: mart_campaign_performance
    description: >
      One row per campaign with last-touch attributed checkouts, customers,
      and revenue (from fct_campaign_attribution + fct_revenue) rolled up
      against budget to compute ROAS.
    data_tests:
      - elementary.schema_changes
    columns:
      - name: campaign_id
        data_tests:
          - not_null
          - unique
