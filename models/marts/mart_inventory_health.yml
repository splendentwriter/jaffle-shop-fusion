models:
  - name: mart_inventory_health
    description: >
      One row per warehouse/product stock position, with product and
      warehouse names attached and the below-reorder-point flag carried
      through from fct_inventory_position.
    columns:
      - name: warehouse_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
