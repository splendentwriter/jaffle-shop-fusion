models:
  - name: mart_payroll
    description: >
      One row per (payroll_run, employee) paycheck, with employee name/
      department/job title attached. has_regular_hours_mismatch flags an
      hourly employee whose paid regular_hours doesn't match the hours
      rolled up independently from their approved timesheets.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not has_regular_hours_mismatch"
    columns:
      - name: payroll_line_item_id
        data_tests:
          - not_null
          - unique
      - name: employee_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_employee')
                field: employee_id
